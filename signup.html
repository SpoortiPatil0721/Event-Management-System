<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CampusBuzz — Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="header">
    <div class="brand">
      <div class="logo">CB</div>
      <div>
        <div class="title">CampusBuzz</div>
        <div class="sub">Events · Clubs · Campus Life</div>
      </div>
    </div>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="signin.html" class="btn neon">Sign In</a>
    </nav>

    <div class="hamburger" aria-hidden="true"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
  </header>

  <main>
    <section class="section reveal">
      <form action="signup.php" method="POST" class="auth-form">
        <h1 class="headline">Create Account</h1>

        <div class="field">
          <input type="text" name="name" id="name" required>
          <label for="name">Full Name</label>
        </div>

        <div class="field">
          <input type="email" name="email" id="email" required>
          <label for="email">Email</label>
        </div>

        <div class="field">
          <input type="password" name="password" id="password" required>
          <label for="password">Password</label>
        </div>

        <div class="field">
          <input type="password" name="confirm_password" id="confirm_password" required>
          <label for="confirm_password">Confirm Password</label>
        </div>

        <button type="submit" class="btn neon">Register</button>

        <p style="text-align:center;margin-top:1rem;color:#cbd6e0">
          Already have an account? <a href="signin.html" style="color:var(--neon)">Sign In</a>
        </p>
      </form>
    </section>
  </main>

  <footer class="footer">© 2025 CampusBuzz — Built for students</footer>
  <script src="script.js"></script>
</body>
</html>
